name: Deploy

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build JSON
        run: python build.py

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          AWS_ENDPOINT_URL: https://s3.investigativedata.org
        run: |
          aws s3 cp dist/topics.json s3://cdn.investigativedata.org/search.openaleph.org/topics.json \
            --content-type application/json \
            --cache-control "public, max-age=300"
          aws s3 cp dist/dataset_groups.json s3://cdn.investigativedata.org/search.openaleph.org/dataset_groups.json \
            --content-type application/json \
            --cache-control "public, max-age=300"
