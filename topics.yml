  - title: Sanctions against Russia after the Invasion of Ukraine
    description: >-
      On 24 February 2022, Russia launched a full-scale invasion of Ukraine, 
      triggering the most significant conflict in Europe in decades. 
      In response, governments introduced wide-ranging sanctions targeting 
      key sectors of the Russian economy, financial systems, and individuals 
      linked to the state, with measures evolving over time. 
      An [overview by CORRECTIV (german, archived)](https://correctiv.org/top-stories/2022/02/28/sanktionstracker-aktuelle-sanktionen-gegen-russland/) 
      provides additional context. The datasets featured here bring together 
      a range of sanctions-related information, enabling further research into their scope, development, and impact.
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Russian_troops_in_Novoaidar%2C_6_March_2022.png/960px-Russian_troops_in_Novoaidar%2C_6_March_2022.png
      alt:
