  - title: Sanctions against Russia after the Invasion of Ukraine
    description: >-
      On 24 February 2022, Russia invaded Ukraine, starting the largest and
      deadliest war in Europe since World War II. The EU has adopted 19 packages
      of sanctions, and the US has designated Gazprombank and 50+ Russian banks.
      [Overview by CORRECTIV (german, archived)](https://correctiv.org/top-stories/2022/02/28/sanktionstracker-aktuelle-sanktionen-gegen-russland/).
    image:
