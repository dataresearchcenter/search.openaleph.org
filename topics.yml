  - title: Landtagswahl in Baden-Württemberg
    description: >-
      The 2026 Baden-Württemberg state election took place on 8 March 2026. 
      The Greens, led by Cem Özdemir, narrowly emerged as the largest party 
      ahead of the CDU under Manuel Hagel, with both parties securing an equal 
      number of seats. Özdemir is expected to succeed Winfried Kretschmann as Minister-President. 
      You can research the historic parliamentary activities of the candidates using datasets 
      such as Parlamentsspiegel, Bundestag DIP, and PARLIS Baden-Württemberg, 
      as well as data on party donations (Parteispenden).
    image:
