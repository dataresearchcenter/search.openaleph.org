  - title: Landtagswahl in Rheinland-Pfalz
    description: >-
      The 2026 Rhineland-Palatinate state election took place on 22 March 2026. 
      The CDU under Gordon Schnieder became the strongest party with 31.0%, ending
      35 years of SPD-led governments. A CDU–SPD grand coalition is being formed. 
      You can explore the historic parliamentary activities of candidates using 
      datasets such as Parlamentsspiegel, Bundestag DIP, and OPAL Rheinland-Pfalz, 
      as well as data on party donations (Parteispenden).
    image:
