  - title: Landtagswahl in Baden-Württemberg
    description: >-
      The 2026 Baden-Württemberg state election took place on 8 March 2026. Cem
      Özdemir (Greens) will succeed Winfried Kretschmann as Minister-Präsident,
      narrowly ahead of Manuel Hagel (CDU). Research the historic parliamentary
      activities of the candidates in the Parlamentsspiegel, Bundestag DIP and
      PARLIS Baden-Württemberg datasets, as well as party donations
      (Parteispenden).
    image:
      url: https://assets.ftm.store/img/Q12839/thumbs/600.jpg
      alt:
        - text: "Cem Özdemir, DIE GRÜNEN"
          language: de
      attribution:
        license: CC BY-SA 4.0
        license_url: https://creativecommons.org/licenses/by-sa/4.0/
        author: Raimond Spekking
        source: Wikimedia Commons
        source_url: https://commons.wikimedia.org/wiki/File:Hart%20aber%20fair%20-%202020-02-10-4295.jpg
    countries:
