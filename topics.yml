  - title: Iran War
    description: >-
      On 28 February 2026, Israel and the United States launched joint airstrikes on Iran,
      marking the start of a broader conflict. Iran responded with missile and drone attacks
      against Israel, U.S. bases, and allied targets in the region.
      You can search through relevant datasets related to this context, 
      including the Iran business registry, as well as EU, US, and Iranian sanctions lists.
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/8a/Attack_on_residential_homes_in_central_Tehran_1.jpg
      alt:
        - text: Damaged buildings in Tehran following US-Israeli strikes
