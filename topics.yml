topics:
  - title: The Epstein Files
    description: >-
      The Epstein files are a partially released collection of millions of
      documents, images, videos, and emails detailing the activities of American
      financier and convicted child sex offender Jeffrey Epstein. Although the US
      Department of Justice published the documents on their website, we don't
      make this dataset public due to its sensitive material and to protect
      victims. We have the **full collection of 1.4 Mio. documents**, please
      [get in touch](mailto:hi@dataresearchcenter.org) to get access.
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Epstein_Files_Phase_1%2C_Part_C_%E2%80%93_Contact_Book_Redacted.pdf/page1-330px-Epstein_Files_Phase_1%2C_Part_C_%E2%80%93_Contact_Book_Redacted.pdf.jpg
      alt:
        - text: "The Epstein Files Phase 1, Part C: Contact Book Redacted."
          language: en
      attribution:
        license: Public Domain
        license_url: https://en.wikipedia.org/wiki/en:Public_domain
        author: US Department of Justice
        source: Wikimedia Commons
        source_url: https://en.wikipedia.org/wiki/File:Epstein_Files_Phase_1,_Part_C_%E2%80%93_Contact_Book_Redacted.pdf
    countries:
      - us
    search_terms:
      - Ghislaine Maxwell
      - Leslie Wexner
      - Leon Black
      - Jes Staley
      - Jean-Luc Brunel
    collections: []

  - title: Iran War
    description: >-
      On 28 February 2026, Israel and the United States began joint air attacks
      on Iran, starting a war primarily aimed at destroying Iran's missile
      program and bringing about regime change. Iran responded with missile and
      drone strikes against Israel, US bases and allies in the region.
    image:
      url: https://upload.wikimedia.org/wikipedia/commons/8/8a/Attack_on_residential_homes_in_central_Tehran_1.jpg
      alt:
        - text: Damaged buildings in Tehran following US-Israeli strikes
          language: en
      attribution:
        license: CC BY-SA 4.0
        license_url: https://creativecommons.org/licenses/by-sa/4.0/
        author: Tasnim News Agency
        source: Wikimedia Commons
        source_url: https://commons.wikimedia.org/wiki/File:Attack_on_residential_homes_in_central_Tehran_1.jpg
